name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The test suite is built on synthetic trees (SPEC.md section 14). Until it lands, CI proves the
# package installs and every command runs end to end on a fresh repository, and that the plugin's
# hooks resolve the installed engine.
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: The CLI runs end to end on a fresh repository
        env:
          PLUGIN: ${{ github.workspace }}/plugin
        run: bash scripts/smoke.sh
      - name: rendered/ matches the prose and the registry
        run: python scripts/render_prose.py --check
