# Adapted from `doc-marshal init --ci`. Validates the docs tree on every pull request.
#
# No `paths:` filter: half of what this checks is whether the anchors still resolve, and those
# break in the change that renames or deletes the code -- which by definition touches no
# documentation. `fetch-depth: 0` because `drifted` and `--range` answer from a git diff, and the
# default shallow clone makes them answer *nothing* rather than fail.
#
# Where a consuming repository pins a release through `uvx`, this one runs the
# engine in the checkout, so the tree that documents the engine is validated by the engine under
# review and no pin exists here to move at release time.
name: docs

on:
  pull_request:

permissions:
  contents: read

jobs:
  doc-marshal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run doc-marshal check --all --format github --range "${{ github.event.pull_request.base.sha }}..HEAD"
      - run: uv run doc-marshal index --check
        continue-on-error: true
      - run: uv run doc-marshal drifted --range "${{ github.event.pull_request.base.sha }}..HEAD" --format github
