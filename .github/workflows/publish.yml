# Publish to PyPI on a version tag, by trusted publishing: no token stored anywhere. PyPI trusts
# this workflow file in this repository (configure once under the project's "Publishing" page:
# owner rootdrew27, repository doc-marshal, workflow publish.yml, environment pypi).
#
# The tag is the release. `v0.1.0` must match `project.version` in pyproject.toml and
# `__version__` -- the check step refuses to build otherwise, so a tag can never publish a wheel
# that reports a different version from its name.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The tag matches the package version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          version=$(uv version --short)
          test "$tag" = "$version" || { echo "tag v$tag but pyproject says $version" >&2; exit 1; }
          grep -q "__version__ = \"$version\"" src/doc_marshal/__init__.py
      - run: uv build
      - name: The wheel installs and runs from a clean environment
        run: |
          uv venv /tmp/venv && uv pip install --python /tmp/venv/bin/python dist/*.whl
          /tmp/venv/bin/doc-marshal --version
          /tmp/venv/bin/doc-marshal info --process > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - run: uv publish --trusted-publishing always
