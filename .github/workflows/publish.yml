# Publish to PyPI when a push to main carries a version PyPI does not have, then tag that commit.
# Merging the release pull request is the release: nobody pushes a tag, so no tag can name a commit
# whose `__version__` disagrees with it. Trusted publishing, so no token is stored anywhere; PyPI
# trusts this workflow file in this repository (configured once under the project's "Publishing"
# page: owner rootdrew27, repository doc-marshal, workflow publish.yml, environment pypi).
#
# Every step is safe to re-run: a version already on PyPI stops the run, the upload skips files
# PyPI already holds, and the tag is made only once the upload has succeeded.
name: publish

on:
  push:
    branches: [main]
    paths: [src/doc_marshal/__init__.py]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The version, and whether PyPI has it
        id: version
        run: |
          set -eu
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/doc_marshal/__init__.py)
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/doc-marshal/$version/json")
          case "$status" in
            200) new=false; echo "doc-marshal $version is already on PyPI -- nothing to publish" ;;
            404) new=true ;;
            *) echo "PyPI answered $status for doc-marshal $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.new == 'true'
        run: uv run --group dev python scripts/sync_version.py --check
      - if: steps.version.outputs.new == 'true'
        run: uv build
      - name: The wheel installs and runs from a clean environment
        if: steps.version.outputs.new == 'true'
        run: |
          uv venv /tmp/venv && uv pip install --python /tmp/venv/bin/python dist/*.whl
          /tmp/venv/bin/doc-marshal --version
          /tmp/venv/bin/doc-marshal info --marshalling > /dev/null
      - if: steps.version.outputs.new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/

  tag:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - name: Tag the published commit
        # Create first, and look the tag up only when creating fails: a missing ref is a 404 whose
        # JSON body `gh api` still prints, so reading a lookup's output cannot tell absent from present.
        run: |
          set -eu
          if gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null; then
            echo "tagged $GITHUB_SHA $TAG"
            exit 0
          fi
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          if [ "$existing" != "$GITHUB_SHA" ]; then
            echo "$TAG already names $existing, not the published $GITHUB_SHA -- delete it and re-run this job" >&2
            exit 1
          fi
