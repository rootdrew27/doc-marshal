# Publish to PyPI on a version tag, by trusted publishing: no token stored anywhere. PyPI trusts
# this workflow file in this repository (configure once under the project's "Publishing" page:
# owner rootdrew27, repository doc-marshal, workflow publish.yml, environment pypi).
#
# The tag is the release. `vX.Y.Z` must match `__version__`, which pyproject.toml reads through
# hatch, and every copy scripts/sync_version.py governs -- the check step refuses to build
# otherwise, so a tag can never publish a wheel that reports a different version from its name.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The tag matches the package version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          grep -qx "__version__ = \"$tag\"" src/doc_marshal/__init__.py \
            || { echo "tag v$tag but __version__ says $(grep __version__ src/doc_marshal/__init__.py)" >&2; exit 1; }
          uv run --group dev python scripts/sync_version.py --check
      - run: uv build
      - name: The wheel installs and runs from a clean environment
        run: |
          uv venv /tmp/venv && uv pip install --python /tmp/venv/bin/python dist/*.whl
          /tmp/venv/bin/doc-marshal --version
          /tmp/venv/bin/doc-marshal info --process > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - run: uv publish --trusted-publishing always
