# Keeps rendered/ -- the standard profile's policies, types and marshalling as `doc-marshal info`
# renders them -- in step with the doctrine and the profile they come from. CI regenerates and
# commits it on push to main as the backstop (.github/workflows/render.yml).
repos:
  - repo: local
    hooks:
      - id: render-doctrine
        name: render doctrine into rendered/
        entry: uv run python scripts/render_doctrine.py
        language: system
        pass_filenames: false
        files: ^(src/doc_marshal/(doctrine/.*|ontology\.py|info\.py|settings\.py|__init__\.py)|scripts/render_doctrine\.py)$
      - id: sync-version
        name: version copies match __version__
        entry: uv run python scripts/sync_version.py --check
        language: system
        pass_filenames: false
        files: ^(src/doc_marshal/(__init__|integrate)\.py|plugin/\.claude-plugin/plugin\.json|README\.md|\.pre-commit-hooks\.yaml|scripts/sync_version\.py)$

  - repo: https://github.com/rootdrew27/doc-marshal
    rev: v0.4.0
    hooks:
      - id: doc-marshal-check
      - id: doc-marshal-index
