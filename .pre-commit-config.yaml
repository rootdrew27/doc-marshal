# Keeps rendered/ -- the standard preset's rules, types and process as `doc-marshal info`
# renders them -- in step with the prose and the registry they come from. CI regenerates and
# commits it on push to main as the backstop (.github/workflows/render.yml).
repos:
  - repo: local
    hooks:
      - id: render-prose
        name: render prose into rendered/
        entry: uv run python scripts/render_prose.py
        language: system
        pass_filenames: false
        files: ^(src/doc_marshal/(prose/.*|ontology\.py|info\.py|settings\.py|__init__\.py)|scripts/render_prose\.py)$
      - id: sync-version
        name: version copies match __version__
        entry: uv run python scripts/sync_version.py --check
        language: system
        pass_filenames: false
        files: ^(src/doc_marshal/__init__\.py|plugin/\.claude-plugin/plugin\.json|README\.md|\.pre-commit-hooks\.yaml|scripts/sync_version\.py)$
