[project]
name = "doc-marshal"
dynamic = ["version"]
description = "A machine-checked documentation tree for repositories whose primary reader is a coding agent."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrew Root" }]
keywords = ["documentation", "linter", "agents", "claude", "docs-as-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
# Deliberately empty, and not by dogma -- see SPEC.md section 9 for the three tests a runtime
# dependency has to pass, and why nothing passes them yet.
dependencies = []

[project.urls]
Homepage = "https://github.com/rootdrew27/doc-marshal"
Source = "https://github.com/rootdrew27/doc-marshal"

[project.scripts]
doc-marshal = "doc_marshal.cli:main"

[dependency-groups]
dev = ["tomli-w>=1.0", "pytest>=8", "ruff>=0.16", "mypy>=1.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `__version__` is the one source of the version; scripts/sync_version.py keeps the other copies
# (plugin.json, README, .pre-commit-hooks.yaml) in step and CI refuses a build when they differ.
[tool.hatch.version]
path = "src/doc_marshal/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_marshal"]

[tool.hatch.build.targets.sdist]
include = ["src/doc_marshal", "plugin", ".pre-commit-hooks.yaml", "README.md", "SPEC.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "scripts", "plugin/hooks"]

[tool.ruff.lint]
# DTZ is left out on purpose: `updated` is the writer's local calendar day, so `date.today()` is
# the right call and a timezone would be a lie about where the note was written.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ISC", "RUF"]
ignore = [
    "E501",   # long lines are messages and docstrings; the formatter wraps the code
    "RUF001", "RUF002", "RUF003",  # ambiguous-unicode: prose legitimately uses these
]

[tool.ruff.lint.isort]
known-first-party = ["doc_marshal"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
strict = true
warn_unreachable = true
