# Hooks for the pre-commit framework (https://pre-commit.com). In a consuming repository:
#
#   - repo: https://github.com/rootdrew27/doc-marshal
#     rev: v0.6.1
#     hooks:
#       - id: doc-marshal-check
#
# `doc-marshal-check` validates the staged notes; errors block the commit. Paths that are not notes
# under the docs tree are skipped silently, so the hook may be handed every markdown file a change
# touched.
- id: doc-marshal-check
  name: doc-marshal check
  description: validate the staged notes against the docs ontology
  entry: doc-marshal check --skip-non-notes
  language: python
  types: [markdown]
  require_serial: true
